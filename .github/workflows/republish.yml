name: Republish JSON

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fit
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      CMDSTAN_VERSION: '2.38.0'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: 'https://stan-dev.r-universe.dev'
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          extra-packages: any::cmdstanr
      - name: Run tests
        run: Rscript tests/test_enrichment.R && Rscript tests/test_publish.R
      - name: Publish JSON
        run: Rscript scripts/publish.R
      - name: Commit publish changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publish/
          if git diff --cached --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "data: republish JSON $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin master
          git push
