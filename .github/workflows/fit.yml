name: Fit Cube Rankings

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC (Iceland is UTC year-round)
  workflow_dispatch:
    inputs:
      force:
        description: "Refit all dates (pass --force to run_historical_analysis.R)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fit
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
      CMDSTAN_VERSION: '2.38.0'
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: 'https://stan-dev.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
        with:
          extra-packages: any::cmdstanr

      - name: Detect new result dates
        id: check
        run: Rscript scripts/check_new_dates.R

      - name: Cache CmdStan installation
        id: cache-cmdstan
        if: steps.check.outputs.new_dates == 'true' || inputs.force == true
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-ubuntu-latest

      - name: Install CmdStan if not cached
        if: (steps.check.outputs.new_dates == 'true' || inputs.force == true) && steps.cache-cmdstan.outputs.cache-hit != 'true'
        run: Rscript -e 'cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)'

      - name: Cache compiled Stan model
        if: steps.check.outputs.new_dates == 'true' || inputs.force == true
        uses: actions/cache@v4
        with:
          path: stan/
          key: stan-exe-${{ env.CMDSTAN_VERSION }}-${{ hashFiles('stan/*.stan') }}-ubuntu-latest

      - name: Fit (skips dates already present unless --force)
        if: steps.check.outputs.new_dates == 'true' || inputs.force == true
        env:
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
        run: Rscript run_historical_analysis.R $FORCE_FLAG

      - name: Run tests
        run: Rscript tests/test_enrichment.R && Rscript tests/test_publish.R && Rscript tests/test_incremental.R

      - name: Publish JSON
        run: Rscript scripts/publish.R

      - name: Commit outputs if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ data/publish/
          if git diff --cached --quiet; then
            echo "No new fits or publish changes"
            exit 0
          fi
          git commit -m "data: cube fit $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin master
          git push

      - name: Push published JSON to mtgkubbur.is (triggers Fly deploy)
        env:
          PUSH_TOKEN: ${{ secrets.MTGKUBBUR_PUSH_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${PUSH_TOKEN}@github.com/mtgkubbur/mtgkubbur.is.git" /tmp/app
          rsync -a --delete data/publish/ /tmp/app/data/kubbur/
          rsync -a --delete config/publish-schemas/ /tmp/app/data/kubbur-schemas/
          cd /tmp/app
          git config user.name  "cube-rankings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kubbur data/kubbur-schemas
          if git diff --cached --quiet; then
            echo "No JSON changes to push to mtgkubbur.is"
          else
            git commit -m "data: sync published JSON from cube_rankings $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
